# Build and deploy woc.marshal.dev to GitHub Pages.
#
# Separate from release.yml so a broken site build never fails a release. The site
# reads the latest release, so release.yml dispatches this after publishing.
#
# Keep `pages: write` and `id-token: write` on the deploy job alone, so no build
# step can publish.

name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/site/**'
      - 'tools/site.mjs'
      - 'tools/catalog.ts'
      - 'tools/featured.ts'
      - 'tools/manifests.ts'
      - 'screenshots/**'
      - 'addons/**'
      - 'packages/types/**'
      - 'loader/src/shared/schema.ts'
      - 'CHANGELOG.md'
      - '.github/workflows/site.yml'
  # Never fires for releases created by GITHUB_TOKEN, which is all of ours;
  # release.yml dispatches this workflow instead.
  release:
    types: [published]
  workflow_dispatch:

# Queue deploys instead of cancelling, so the newer commit still deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Corepack must come before setup-node's pnpm cache, which needs pnpm on PATH.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Reads the latest release for the install button; the token lifts the
      # unauthenticated rate limit.
      - name: Build the site
        run: pnpm site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The build copies CNAME from site/static/. Without it in the artifact the
      # custom domain silently stops resolving on deploy.
      - name: Verify the artifact carries CNAME
        run: |
          test -f site/dist/CNAME || { echo "site/dist/CNAME missing"; exit 1; }
          echo "CNAME: $(cat site/dist/CNAME)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
