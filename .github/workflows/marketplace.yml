name: Generated files

# Regenerates the two files DERIVED from addons/*/addon.json: marketplace.json and
# the README's addon section between its `<!-- addons:start -->` markers.
#
# Keep this ONE job. As two workflows on the same push, both would check out the
# same commit and the second push would be rejected as non-fast-forward, only on
# the day both files change.
#
# site/content/docs/publishing.md tells third-party marketplaces to copy this file.
# `pnpm readme` treats a README with no markers as nothing to do.
on:
  push:
    branches: [main]
    paths:
      - 'addons/**'
      - 'README.md'
      - 'loader/src/shared/schema.ts'
      - 'loader/src/shared/api-version.ts'
      - 'loader/src/shared/permissions.ts'
      - 'tools/manifests.ts'
      - 'tools/catalog.ts'
      - 'tools/featured.ts'
      - 'tools/index.mjs'
      - 'tools/readme.mjs'
      - 'tools/readme-core.ts'
      - 'tools/validate.mjs'
      - '.github/workflows/marketplace.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm validate

      - name: Regenerate the index
        # Stamp `generated` from the commit so rebuilding the same commit is
        # byte-identical and never produces an empty diff commit.
        run: pnpm index -- --timestamp=$(git log -1 --pretty=%ct)

      - name: Regenerate the README's addon section
        run: pnpm readme

      - name: Commit if changed
        run: |
          index=$(git diff --name-only -- marketplace.json)
          readme=$(git diff --name-only -- README.md)
          if [ -z "$index" ] && [ -z "$readme" ]; then
            echo "generated files unchanged"
            exit 0
          fi

          title="Regenerate the marketplace index and README catalog"
          [ -n "$readme" ] || title="Regenerate marketplace index"
          [ -n "$index" ] || title="Regenerate the README addon section"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketplace.json README.md
          git commit -m "$title

          Rebuilt what addons/*/addon.json derives, so neither the index the
          loader fetches nor the catalog the README prints can drift from the
          manifests on disk."
          git push
