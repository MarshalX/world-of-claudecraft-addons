# git-cliff ~ https://git-cliff.org/docs/configuration
#
# CHANGELOG.md and every release body are GENERATED from commit titles.
#
# A title is a capitalized imperative verb phrase with no type prefix, and the
# VERB is the category (see commit_parsers). Anything unrecognised lands in
# Changed, so lead with the verb: "Support for X" is filed by accident at best.

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

This file is generated by `pnpm changelog` and is never edited by hand.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# The `<!-- N -->` prefix sorts groups into Keep a Changelog's order; `striptags` removes it.
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                    /compare/{{ release.previous.version }}..{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                    /tree/{{ release.version }}
        {% endif -%}
    {% else -%}
        {% if release.previous.version -%}
            [unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                /compare/{{ release.previous.version }}..HEAD
        {% endif -%}
    {% endif -%}
{% endfor %}
"""
trim = true

[git]
# Off: commit titles here never carry a `type(scope):` prefix.
conventional_commits = false
filter_commits = false
topo_order = false
sort_commits = "oldest"

# Only loader releases: a `types-v*` tag would otherwise end a loader release
# section and take its commits with it.
tag_pattern = "v[0-9]*"

commit_parsers = [
    # Machine-written titles pushed by .github/workflows/marketplace.yml.
    { message = "^Regenerate marketplace index", skip = true },
    { message = "^Regenerate the marketplace index and README catalog", skip = true },
    { message = "^Regenerate the README addon section", skip = true },
    { message = "^Merge ", skip = true },

    { message = "(?i)^(add|implement|introduce|mount|scaffold|support|publish)", group = "<!-- 0 -->Added" },
    { message = "(?i)^(fix|correct|prevent|guard|repair)", group = "<!-- 2 -->Fixed" },
    { message = "(?i)^(remove|delete|drop)", group = "<!-- 3 -->Removed" },
    { message = "^.*", group = "<!-- 1 -->Changed" },
]
