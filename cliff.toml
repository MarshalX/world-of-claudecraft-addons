# git-cliff ~ https://git-cliff.org/docs/configuration
#
# CHANGELOG.md and every release body are GENERATED from commit titles, never
# hand-written, the same way marketplace.json is generated from the manifests.
#
# This works because of a convention AGENTS.md already imposes for readability:
# a commit title is a capitalized imperative verb phrase with no type prefix.
# The VERB is the category. `Add the net and world read surfaces` is an addition
# and `Build the runtime bundle before linting` is a change, and neither needed a
# `feat:` in front of it to say so. Adapted from the `keepachangelog.toml` that
# git-cliff ships as an example, which groups on exactly that.
#
# Grouping by verb rather than by prefix has one consequence worth knowing when
# writing a commit: the catch-all lands anything unrecognised in Changed, so a
# title that buries its verb ("Support for X") is filed correctly by accident at
# best. Lead with the verb.

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

This file is generated by `pnpm changelog` and is never edited by hand.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# Groups carry a `<!-- N -->` sort key so they render in Keep a Changelog's
# order rather than alphabetically, and `striptags` takes it back off.
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                    /compare/{{ release.previous.version }}..{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                    /tree/{{ release.version }}
        {% endif -%}
    {% else -%}
        {% if release.previous.version -%}
            [unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                /compare/{{ release.previous.version }}..HEAD
        {% endif -%}
    {% endif -%}
{% endfor %}
"""
trim = true

[git]
# Off deliberately. AGENTS.md forbids the `type(scope):` prefix in a commit
# title, so no commit here is a conventional one and turning this on would only
# mean every commit taking the unconventional path anyway.
conventional_commits = false
filter_commits = false
topo_order = false
sort_commits = "oldest"

# Only loader releases. `types-v*` tags the `@woc-addons/types` package on its
# own cadence, and without this pattern one of those would end a loader release
# section and take its commits with it.
tag_pattern = "v[0-9]*"

commit_parsers = [
    # Machine-written. `Regenerate marketplace index` is pushed by the
    # marketplace workflow after an addon change, so the addon change is
    # already in the changelog and this is its echo.
    { message = "^Regenerate marketplace index", skip = true },
    { message = "^Merge ", skip = true },

    { message = "(?i)^(add|implement|introduce|mount|scaffold|support|publish)", group = "<!-- 0 -->Added" },
    { message = "(?i)^(fix|correct|prevent|guard|repair)", group = "<!-- 2 -->Fixed" },
    { message = "(?i)^(remove|delete|drop)", group = "<!-- 3 -->Removed" },
    { message = "^.*", group = "<!-- 1 -->Changed" },
]
