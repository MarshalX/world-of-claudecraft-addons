<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Addon stage</title>
    <!-- The game's own faces, linked from where play.html loads them so they
         match exactly. If `pnpm theme` shows --font-display or --font-ui has
         changed, edit this line. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- The game's :root tokens and the game classes the kit wears. Generated by
         `pnpm theme`; never hand-edited. -->
    <link rel="stylesheet" href="/theme.generated.css" />
    <link rel="stylesheet" href="/stage.css" />
  </head>
  <body>
    <!-- The bundle creates the loader's stylesheet and #woc-addons root, as the
         runtime does in the game. -->
    <script defer src="/stage.js"></script>
  </body>
</html>
