<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Addon stage</title>
    <!-- The game's own faces, from the same place its own play.html asks for
         them. Linked rather than self-hosted: this page is loopback-only and
         never ships, so the one thing self-hosting would buy (not depending on a
         third party at run time) is worth less than the fonts being exactly the
         ones the game loads. `pnpm theme` names them in --font-display and
         --font-ui, so a game release that changes face is picked up by
         regenerating the tokens and editing this line. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- The game's :root tokens, which is the whole of what the loader inherits
         from it. Generated by `pnpm theme`; never hand-edited. -->
    <link rel="stylesheet" href="/theme.generated.css" />
    <link rel="stylesheet" href="/stage.css" />
  </head>
  <body>
    <!-- The loader's own stylesheet and the #woc-addons root are both created by
         the bundle, exactly as the runtime creates them in the game. Nothing
         about an addon's UI is in this file. -->
    <script defer src="/stage.js"></script>
  </body>
</html>
